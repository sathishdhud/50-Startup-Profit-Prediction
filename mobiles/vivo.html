                price: 54999,

                ram: 12,
                processor: "Snapdragon 8 Gen5",
                camera: "50MP + 50MP",

                rating: 92,

                ratingsCount: 1850,
                store: "Flipkart",
                badge: "Coming Soon",
                date: "Feb 2026",
                storeurl: "https://fktr.in/vivo-x300-fe"
            },
            {
                id: 3,
                name: "Vivo V70 5G",
                brand: "Vivo",
                img: "./mobiles/vivo-v70/image1.png",
                price: 39999,
                originalPrice: 42999,
                ram: 8,
                processor: "Dimensity 8300",
                camera: "50MP OIS",
                battery: "5000 mAh",
                rating: 89,
                url: "./mobiles/vivo-v70",
                ratingsCount: 3200,
                store: "Amazon",
                badge: "Available",
                date: "Dec 2025",
                storeurl: "https://amzn.to/vivo-v70"
            },
            {
                id: 4,
                name: "Vivo T5x 5G",
                brand: "Vivo",
                img: "./mobiles/vivo-t5x-5g/image1.png",
                price: 18999,
                originalPrice: 19999,
                ram: 8,
                processor: "Dimensity 6020",
                camera: "50MP Main",
                battery: "6000 mAh",
                rating: 85,
                url: "./mobiles/vivo-t5x-5g",
                ratingsCount: 5600,
                store: "Flipkart",
                badge: "Budget King",
                date: "March 2026",
                storeurl: "https://fktr.in/vivo-t5x"
            }
        ];

        const FILTER_DEFINITIONS = {
            price: [
                { label: "Under ₹20,000", min: 0, max: 20000 },
                { label: "₹20,000 - ₹40,000", min: 20000, max: 40000 },
                { label: "₹40,000 - ₹60,000", min: 40000, max: 60000 },
                { label: "Over ₹60,000", min: 60000, max: 999999 }
            ],
            ram: [6, 8, 12],
            rating: [90, 80]
        };

        // --- 2. State Management ---
        let currentFilters = { price: null, ram: null, rating: null, search: "" };
        let currentPage = 1;
        const itemsPerPage = 5;

        // --- 3. Initialization ---
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            initFiltersUI();
            renderApp();
            document.getElementById('searchInput').addEventListener('input', (e) => {
                currentFilters.search = e.target.value.toLowerCase();
                currentPage = 1;
                renderApp();
            });
        });

        // --- 4. Filter Logic ---
        function initFiltersUI() {
            // Desktop Price
            document.getElementById('desktopPriceFilters').innerHTML = FILTER_DEFINITIONS.price.map(f => `
                <label class="flex items-center justify-between cursor-pointer group">
                    <span class="flex items-center gap-2">
                        <input type="radio" name="d_price" class="w-4 h-4 border-border text-primary focus:ring-primary" onchange="handleFilterChange('price', '${f.label}')">
                        <span class="group-hover:text-primary">${f.label}</span>
                    </span>
                </label>
            `).join('');

            // Desktop RAM
            document.getElementById('desktopRamFilters').innerHTML = FILTER_DEFINITIONS.ram.map(val => `
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" class="w-4 h-4 rounded border-border text-primary focus:ring-primary" onchange="handleFilterChange('ram', ${val})">
                    <span class="text-sm text-text-medium">${val} GB</span>
                </label>
            `).join('');

            // Desktop Rating
            document.getElementById('desktopRatingFilters').innerHTML = `
                 <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" class="w-4 h-4 rounded border-border text-primary focus:ring-primary" onchange="handleFilterChange('rating', 90)">
                    <span class="text-sm text-text-medium">90% & above</span>
                </label>
                 <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" class="w-4 h-4 rounded border-border text-primary focus:ring-primary" onchange="handleFilterChange('rating', 80)">
                    <span class="text-sm text-text-medium">80% & above</span>
                </label>
            `;

            // Mobile Price
            document.getElementById('mobilePriceFilters').innerHTML = FILTER_DEFINITIONS.price.map(f => `
                <label class="flex items-center justify-between py-2 cursor-pointer border-b border-border">
                    <span class="text-sm text-text-medium">${f.label}</span>
                    <input type="radio" name="m_price" class="w-5 h-5 border-border text-primary" onchange="setTempFilter('price', '${f.label}')">
                </label>
            `).join('');

            // Mobile RAM
            document.getElementById('mobileRamFilters').innerHTML = FILTER_DEFINITIONS.ram.map(val => `
                <button onclick="this.classList.toggle('bg-primary'); this.classList.toggle('text-white'); toggleMobileRam(${val})" class="px-4 py-2 text-sm border border-border rounded-full hover:border-primary transition-colors">${val} GB</button>
            `).join('');
        }

        let tempMobileFilters = {};

        function handleFilterChange(type, value) {
            if (type === 'price') {
                currentFilters.price = value;
            } else if (type === 'ram' || type === 'rating') {
                const currentVal = currentFilters[type];
                currentFilters[type] = (currentVal === value) ? null : value;
            }
            currentPage = 1;
            renderApp();
        }

        function toggleQuickFilter(type, val) {
            if (type === 'price') currentFilters.price = currentFilters.price === val ? null : val;
            else if (type === 'ram') currentFilters.ram = currentFilters.ram === val ? null : val;
            currentPage = 1;
            renderApp();
        }

        function openMobileFilter() {
            tempMobileFilters = JSON.parse(JSON.stringify(currentFilters));
            document.getElementById('mobileFilterModal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeMobileFilter() {
            document.getElementById('mobileFilterModal').classList.add('hidden');
            document.body.style.overflow = '';
        }

        function setTempFilter(type, value) { tempMobileFilters[type] = value; }
        function toggleMobileRam(val) {
            if (tempMobileFilters.ram === val) tempMobileFilters.ram = null;
            else tempMobileFilters.ram = val;
        }

        function applyMobileFilters() {
            currentFilters = tempMobileFilters;
            currentPage = 1;
            renderApp();
            closeMobileFilter();
        }

        function resetFilters() {
            currentFilters = { price: null, ram: null, rating: null, search: currentFilters.search };
            document.querySelectorAll('input[type="radio"]').forEach(i => i.checked = false);
            document.querySelectorAll('input[type="checkbox"]').forEach(i => i.checked = false);
            currentPage = 1;
            renderApp();
        }

        // --- 5. Rendering Logic ---
        function getFilteredData() {
            let data = [...PRODUCTS];
            if (currentFilters.search) data = data.filter(p => p.name.toLowerCase().includes(currentFilters.search));
            if (currentFilters.price) {
                const rangeObj = FILTER_DEFINITIONS.price.find(p => p.label === currentFilters.price);
                if (rangeObj) data = data.filter(p => p.price >= rangeObj.min && p.price <= rangeObj.max);
            }
            if (currentFilters.ram) data = data.filter(p => p.ram === currentFilters.ram);
            if (currentFilters.rating) data = data.filter(p => p.rating >= currentFilters.rating);
            return data;
        }

        function renderApp() {
            const filteredData = getFilteredData();
            renderProductList(filteredData);
            renderPagination(filteredData.length);
            updateResultsCount(filteredData.length);
        }

        function updateResultsCount(count) {
            document.getElementById('resultsCount').innerHTML = `<span class="font-semibold text-text-dark">${count}</span> phones found`;
        }

        function renderProductList(data) {
            const container = document.getElementById('productList');
            const noResults = document.getElementById('noResults');
            const start = (currentPage - 1) * itemsPerPage;
            const paginatedItems = data.slice(start, start + itemsPerPage);

            if (paginatedItems.length === 0) {
                container.innerHTML = '';
                noResults.classList.remove('hidden');
                return;
            }
            noResults.classList.add('hidden');
            container.innerHTML = paginatedItems.map(product => createProductCard(product)).join('');
            lucide.createIcons();
        }

        function createProductCard(p) {
            const discount = p.originalPrice ? Math.round((1 - (p.price / p.originalPrice)) * 100) : 0;
            return `
            <div class="product-card bg-white border border-border rounded-lg overflow-hidden transition-shadow mb-4">
                <div class="flex flex-col">
                    <div class="flex flex-row">
                        <!-- Image -->
                        <div class="w-32 md:w-56 shrink-0 p-3 md:p-5 flex flex-col items-center justify-center bg-white border-r border-border relative">
                            ${p.badge ? `<span class="absolute top-2 left-2 bg-orange text-white text-xs font-semibold px-2 py-1 rounded">${p.badge}</span>` : ''}
                            <img src="${p.img}" alt="${p.name}" class="w-full h-auto object-contain max-h-32 md:max-h-44">
                        </div>
                        <!-- Content -->
                        <div class="flex-1 p-4 md:p-5 flex flex-col bg-white min-w-0">
                            <a href="${p.url}" class="block">
                              <h2 class="text-base md:text-lg font-semibold text-text-dark hover:text-primary cursor-pointer">${p.name}</h2>
                            </a>
                            <p class="text-sm text-text-light mt-1">Released: ${p.date}</p>
                            <div class="mt-2 flex flex-wrap items-center gap-2 text-sm text-text-medium">
                                <span class="flex items-center gap-1"><i data-lucide="cpu" class="w-4 h-4 text-text-light"></i> ${p.processor}</span>
                                <span class="text-text-light">|</span>
                                <span class="flex items-center gap-1"><i data-lucide="memory-stick" class="w-4 h-4 text-text-light"></i> ${p.ram} GB RAM</span>
                            </div>
                            <div class="flex flex-wrap items-center gap-2 text-sm text-text-medium mt-1">
                                <span class="flex items-center gap-1"><i data-lucide="camera" class="w-4 h-4 text-text-light"></i> ${p.camera}</span>
                                <span class="text-text-light">|</span>
                                <span class="flex items-center gap-1"><i data-lucide="battery-full" class="w-4 h-4 text-text-light"></i> ${p.battery}</span>
                            </div>
                            <div class="flex items-center gap-2 mt-3">
                                <span class="bg-success text-white text-sm font-semibold px-2 py-0.5 rounded">${p.rating}%</span>
                                <span class="text-sm text-text-light">${p.ratingsCount.toLocaleString()} ratings</span>
                            </div>
                            <div class="mt-auto pt-3 flex flex-col sm:flex-row sm:items-end sm:justify-between gap-3">
                                <div>
                                    <div class="flex items-baseline gap-2">
                                        <span class="text-xl md:text-2xl font-bold text-text-dark">₹${p.price.toLocaleString()}</span>
                                        ${p.originalPrice ? `<span class="text-sm text-text-light line-through">₹${p.originalPrice.toLocaleString()}</span><span class="text-xs font-medium text-success bg-green-50 px-2 py-1 rounded">${discount}% off</span>` : ''}
                                    </div>
                                    <a href="${p.storeurl}" target="_blank" class="text-sm text-orange-600 font-medium" style="color:#ff6a00;">${p.store}</a>
                                </div>
                                <div class="hidden md:flex gap-3">
                                    <button class="px-4 py-2 text-sm font-medium text-text-medium border border-border rounded hover:bg-bg-light">Compare</button>
                                    <a href="${p.storeurl}" target="_blank" class="px-4 py-2 text-sm font-medium text-white bg-primary rounded btn-primary inline-block">Go to store</a>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- Mobile Buttons -->
                    <div class="flex md:hidden gap-2 p-3 border-t border-border bg-bg-light">
                        <button class="flex-1 px-4 py-2 text-sm font-medium text-text-medium border border-border rounded-lg bg-white hover:bg-gray-50">Compare</button>
                        <a href="${p.storeurl}" target="_blank" class="px-4 py-2 text-sm font-medium text-white bg-primary rounded btn-primary inline-block">Go to store</a>
                    </div>
                </div>
            </div>`;
        }

        function renderPagination(totalItems) {
            const container = document.getElementById('paginationContainer');
            const totalPages = Math.ceil(totalItems / itemsPerPage);
            if (totalPages <= 1) { container.innerHTML = ''; return; }

            let html = `<button onclick="goToPage(${currentPage - 1})" class="w-8 h-8 flex items-center justify-center rounded hover:bg-bg-light text-text-light ${currentPage === 1 ? 'opacity-50 cursor-not-allowed' : ''}" ${currentPage === 1 ? 'disabled' : ''}><i data-lucide="chevron-left" class="w-4 h-4"></i></button>`;
            
            let pagesToShow = [];
            if (totalPages <= 5) pagesToShow = Array.from({ length: totalPages }, (_, i) => i + 1);
            else {
                if (currentPage <= 3) pagesToShow = [1, 2, 3, 4, '...', totalPages];
                else if (currentPage >= totalPages - 2) pagesToShow = [1, '...', totalPages - 2, totalPages - 1, totalPages];
                else pagesToShow = [1, '...', currentPage - 1, currentPage, currentPage + 1, '...', totalPages];
            }

            pagesToShow.forEach(page => {
                if (page === '...') html += `<span class="w-8 h-8 flex items-center justify-center text-text-light text-sm">...</span>`;
                else html += `<button onclick="goToPage(${page})" class="w-8 h-8 flex items-center justify-center rounded text-sm ${page === currentPage ? 'bg-primary text-white font-medium' : 'text-text-medium hover:bg-bg-light'}">${page}</button>`;
            });

            html += `<button onclick="goToPage(${currentPage + 1})" class="w-8 h-8 flex items-center justify-center rounded hover:bg-bg-light text-text-light ${currentPage === totalPages ? 'opacity-50 cursor-not-allowed' : ''}" ${currentPage === totalPages ? 'disabled' : ''}><i data-lucide="chevron-right" class="w-4 h-4"></i></button>`;
            container.innerHTML = html;
            lucide.createIcons();
        }

        function goToPage(page) {
            const totalItems = getFilteredData().length;
            const totalPages = Math.ceil(totalItems / itemsPerPage);
            if (page < 1 || page > totalPages) return;
            currentPage = page;
            renderApp();
            window.scrollTo({ top: document.getElementById('productList').offsetTop - 100, behavior: 'smooth' });
        }

        // Search Suggestions
        const searchInput = document.getElementById('searchInput');
        const suggestionsBox = document.getElementById('searchSuggestions');
        
        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            if (!query) { suggestionsBox.classList.add("hidden"); return; }
            
            const results = PRODUCTS.filter(p => p.name.toLowerCase().includes(query)).slice(0, 5);
            if(results.length === 0) { suggestionsBox.classList.add("hidden"); return; }

            suggestionsBox.innerHTML = results.map(p => `
               <a href="${p.url}" class="flex items-center gap-3 p-3 hover:bg-gray-50 border-b group">
                    <img src="${p.img}" class="w-14 h-14 object-contain rounded bg-gray-50 shrink-0">
                    <div class="flex flex-col min-w-0">
                        <span class="text-sm font-semibold text-gray-800 group-hover:text-primary truncate">${p.name}</span>
                        <div class="flex items-center gap-2 text-xs text-gray-500 mt-1">
                            <span>${p.camera}</span><span>|</span><span>${p.battery}</span>
                        </div>
                    </div>
                </a>
            `).join("");
            suggestionsBox.classList.remove("hidden");
        });

        document.addEventListener("click", function(e) {
            if (!searchInput.contains(e.target) && !suggestionsBox.contains(e.target)) suggestionsBox.classList.add("hidden");
        });

        function openMenu() { document.getElementById("mobileMenu").classList.remove("translate-x-full"); }
        function closeMenu() { document.getElementById("mobileMenu").classList.add("translate-x-full"); }
    </script>
</body>
</html
