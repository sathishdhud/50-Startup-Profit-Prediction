        // --- 4. Filter Logic ---
        function initFiltersUI() {
            // Desktop Price
            const dPriceContainer = document.getElementById('desktopPriceFilters');
            dPriceContainer.innerHTML = FILTER_DEFINITIONS.price.map(f => `

            // Desktop RAM

                    <input type="checkbox" class="w-4 h-4 rounded border-border text-primary focus:ring-primary" onchange="handleFilterChange('ram', ${val})">
                    <span class="text-sm text-text-medium">${val} GB</span>

            `).join('');

             // Desktop Rating
            const dRatingContainer = document.getElementById('desktopRatingFilters');
            dRatingContainer.innerHTML = `

                    <input type="checkbox" class="w-4 h-4 rounded border-border text-primary focus:ring-primary" onchange="handleFilterChange('rating', 90)">
                    <span class="text-sm text-text-medium">90% & above</span>

            `;

            // Mobile Price
             const mPriceContainer = document.getElementById('mobilePriceFilters');
             mPriceContainer.innerHTML = FILTER_DEFINITIONS.price.map(f => `
                <label class="flex items-center justify-between py-2 cursor-pointer border-b border-border">
                    <span class="text-sm text-text-medium">${f.label}</span>
                    <input type="radio" name="m_price" class="w-5 h-5 border-border text-primary" onchange="setTempFilter('price', '${f.label}')">
                </label>
            `).join('');

            // Mobile RAM
            const mRamContainer = document.getElementById('mobileRamFilters');
            mRamContainer.innerHTML = FILTER_DEFINITIONS.ram.map(val => `
                <button onclick="this.classList.toggle('bg-primary'); this.classList.toggle('text-white'); toggleMobileRam(${val})" class="px-4 py-2 text-sm border border-border rounded-full hover:border-primary transition-colors">${val} GB</button>
            `).join('');
        }

        let tempMobileFilters = {}; // Temporary state for mobile modal

        function handleFilterChange(type, value) {
            if (type === 'price') {
                // Radio behavior: if clicked same, uncheck? Usually radios stick. We'll keep simple.
                currentFilters.price = value;
            } else if (type === 'ram' || type === 'rating') {
                // Toggle behavior for checkboxes (simplified: single value logic for demo, can be array)
                const currentVal = currentFilters[type];
                // Simple toggle for demo purposes
                currentFilters[type] = (currentVal === value) ? null : value;
                // Update checkbox visual state immediately if needed (handled by re-render or direct dom manipulation)
            }
            currentPage = 1;
            renderApp();
        }

        function toggleQuickFilter(type, val) {
             if (type === 'price') {
                currentFilters.price = currentFilters.price === val ? null : val;
            } else if (type === 'ram') {
                 currentFilters.ram = currentFilters.ram === val ? null : val;
            }
            currentPage = 1;
            renderApp();
        }

        // Mobile Modal Logic
        function openMobileFilter() {
            tempMobileFilters = JSON.parse(JSON.stringify(currentFilters)); // Clone state
            document.getElementById('mobileFilterModal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeMobileFilter() {
            document.getElementById('mobileFilterModal').classList.add('hidden');
            document.body.style.overflow = '';
        }

        function setTempFilter(type, value) {
            tempMobileFilters[type] = value;
        }
        
        function toggleMobileRam(val) {
             if (tempMobileFilters.ram === val) tempMobileFilters.ram = null;
             else tempMobileFilters.ram = val;
        }

        function applyMobileFilters() {
            currentFilters = tempMobileFilters;
            currentPage = 1;
            renderApp();
            closeMobileFilter();
        }

        function resetFilters() {
            currentFilters = { price: null, ram: null, rating: null, search: currentFilters.search };
            // Reset UI inputs
            document.querySelectorAll('input[type="radio"]').forEach(i => i.checked = false);
            document.querySelectorAll('input[type="checkbox"]').forEach(i => i.checked = false);
            // Reset mobile modal buttons visual if needed
            currentPage = 1;
            renderApp();
        }

        // --- 5. Rendering Logic ---

        function getFilteredData() {
            let data = [...PRODUCTS];

            // Filter Search
            if (currentFilters.search) {
                data = data.filter(p => p.name.toLowerCase().includes(currentFilters.search));
            }

            // Filter Price
            if (currentFilters.price) {
                const rangeObj = FILTER_DEFINITIONS.price.find(p => p.label === currentFilters.price);
                if (rangeObj) {
                    data = data.filter(p => p.price >= rangeObj.min && p.price <= rangeObj.max);
                }
            }

            // Filter RAM
            if (currentFilters.ram) {
                data = data.filter(p => p.ram === currentFilters.ram);
            }

            // Filter Rating
            if (currentFilters.rating) {
                data = data.filter(p => p.rating >= currentFilters.rating);
            }

            return data;
        }

        function renderApp() {
            const filteredData = getFilteredData();
            renderProductList(filteredData);
            renderPagination(filteredData.length);
            updateResultsCount(filteredData.length);
        }

        function renderPagination(totalItems) {
            const container = document.getElementById('paginationContainer');
            const totalPages = Math.ceil(totalItems / itemsPerPage);

            if (totalPages <= 1) {
                container.innerHTML = '';
                return;
            }

            let html = `
                <button onclick="goToPage(${currentPage - 1})" class="w-8 h-8 flex items-center justify-center rounded hover:bg-bg-light text-text-light ${currentPage === 1 ? 'opacity-50 cursor-not-allowed' : ''}" ${currentPage === 1 ? 'disabled' : ''}>
                    <i data-lucide="chevron-left" class="w-4 h-4"></i>
                </button>
            `;

            // Page numbers logic (show limited numbers)
            let pagesToShow = [];
            if (totalPages <= 5) {
                pagesToShow = Array.from({ length: totalPages }, (_, i) => i + 1);
            } else {
                if (currentPage <= 3) pagesToShow = [1, 2, 3, 4, '...', totalPages];
                else if (currentPage >= totalPages - 2) pagesToShow = [1, '...', totalPages - 3, totalPages - 2, totalPages - 1, totalPages];
                else pagesToShow = [1, '...', currentPage - 1, currentPage, currentPage + 1, '...', totalPages];
            }

            pagesToShow.forEach(page => {
                if (page === '...') {
                    html += `<span class="w-8 h-8 flex items-center justify-center text-text-light text-sm">...</span>`;
                } else {
                    html += `
                        <button onclick="goToPage(${page})" class="w-8 h-8 flex items-center justify-center rounded text-sm ${page === currentPage ? 'bg-primary text-white font-medium' : 'text-text-medium hover:bg-bg-light'}">
                            ${page}
                        </button>
                    `;
                }
            });

            html += `
                <button onclick="goToPage(${currentPage + 1})" class="w-8 h-8 flex items-center justify-center rounded hover:bg-bg-light text-text-light ${currentPage === totalPages ? 'opacity-50 cursor-not-allowed' : ''}" ${currentPage === totalPages ? 'disabled' : ''}>
                    <i data-lucide="chevron-right" class="w-4 h-4"></i>
                </button>
            `;

            container.innerHTML = html;
            lucide.createIcons();
        }

        function goToPage(page) {
            const totalItems = getFilteredData().length;
            const totalPages = Math.ceil(totalItems / itemsPerPage);
            if (page < 1 || page > totalPages) return;
            currentPage = page;
            renderApp();
            // Scroll to top of list
            window.scrollTo({ top: document.getElementById('productList').offsetTop - 100, behavior: 'smooth' });
        }
    </script>
